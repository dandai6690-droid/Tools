<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCWW Inspector Scheduler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1c2330;
    --border:    #2a3441;
    --border2:   #374151;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --accent:    #1f6feb;
    --accent2:   #388bfd;
    --water:     #0ea5e9;
    --water2:    #38bdf8;
    --success:   #3fb950;
    --warning:   #d29922;
    --pill-bg:   #21262d;
    --drag-over: rgba(56, 139, 253, 0.12);
    --drag-border: #388bfd;

    /* Task colours */
    --t1: #1d4ed8; --t1l: #dbeafe;
    --t2: #7c3aed; --t2l: #ede9fe;
    --t3: #0891b2; --t3l: #cffafe;
    --t4: #15803d; --t4l: #dcfce7;
    --t5: #b45309; --t5l: #fef3c7;
    --t6: #be185d; --t6l: #fce7f3;
    --t7: #dc2626; --t7l: #fee2e2;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-mark {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--water), var(--accent));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500;
    color: #fff; flex-shrink: 0;
  }
  header h1 {
    font-size: 14px; font-weight: 600; color: var(--text);
    letter-spacing: -0.2px;
  }
  header p { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .header-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 10px;
  }
  .week-nav {
    display: flex; align-items: center; gap: 6px;
  }
  .week-nav button {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px;
    width: 28px; height: 28px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all .15s;
  }
  .week-nav button:hover { border-color: var(--accent); color: var(--accent2); }
  .week-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--muted);
    min-width: 120px; text-align: center;
  }
  .btn-clear {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font-size: 11px;
    font-family: 'Inter', sans-serif;
    transition: all .15s;
  }
  .btn-clear:hover { border-color: var(--warning); color: var(--warning); }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 0;
    min-height: calc(100vh - 57px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto;
  }
  .sidebar-section h3 {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px;
    padding: 0 4px;
  }
  .task-legend { display: flex; flex-direction: column; gap: 4px; }
  .task-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 6px;
    background: var(--pill-bg); border: 1px solid var(--border);
    cursor: grab; font-size: 11px; font-weight: 500;
    transition: all .15s; user-select: none;
  }
  .task-chip:hover { border-color: var(--border2); background: var(--surface2); }
  .task-chip:active { cursor: grabbing; opacity: .7; }
  .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-chip.dragging { opacity: .4; }

  /* ── AVAILABILITY PANEL ── */
  .avail-section h3 {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 8px; padding: 0 4px;
  }
  .avail-day-tabs {
    display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .day-tab {
    background: var(--pill-bg); border: 1px solid var(--border);
    color: var(--muted); border-radius: 5px;
    padding: 3px 8px; font-size: 10px; font-weight: 500;
    cursor: pointer; transition: all .15s; font-family: 'Inter', sans-serif;
  }
  .day-tab:hover { border-color: var(--accent); color: var(--accent2); }
  .day-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .inspector-pool {
    display: flex; flex-direction: column; gap: 4px;
    min-height: 40px;
  }
  .inspector-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 7px;
    background: var(--surface2); border: 1px solid var(--border);
    cursor: grab; font-size: 12px; font-weight: 500;
    color: var(--text); transition: all .15s; user-select: none;
    position: relative;
  }
  .inspector-chip:hover { border-color: var(--water); background: rgba(14,165,233,.06); }
  .inspector-chip:active { cursor: grabbing; }
  .inspector-chip.dragging { opacity: .3; }
  .inspector-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; flex-shrink: 0;
    color: #fff;
  }
  .pool-empty {
    font-size: 11px; color: var(--muted); font-style: italic;
    padding: 8px 4px; text-align: center;
  }

  /* ── MAIN GRID ── */
  .main {
    padding: 16px;
    overflow: auto;
  }
  .grid-wrap {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    min-width: 700px;
  }

  .day-col {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: border-color .15s;
  }
  .day-col.drag-over {
    border-color: var(--drag-border);
    background: linear-gradient(var(--surface), var(--drag-over));
  }

  .day-header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .day-name {
    font-size: 12px; font-weight: 700;
    color: var(--text); letter-spacing: .3px;
  }
  .day-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }
  .day-count {
    margin-top: 6px;
    font-size: 10px; color: var(--muted);
  }
  .day-count span { color: var(--water2); font-weight: 600; }

  .day-slots {
    padding: 8px;
    flex: 1;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 180px;
  }

  /* assignment card */
  .assign-card {
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--pill-bg);
    padding: 7px 9px;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
    animation: pop .18s ease-out;
  }
  @keyframes pop {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .assign-top {
    display: flex; align-items: center; gap: 7px;
  }
  .assign-name {
    font-size: 12px; font-weight: 600; color: var(--text); flex: 1;
  }
  .assign-remove {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1;
    padding: 0 2px; border-radius: 3px;
    transition: color .12s;
  }
  .assign-remove:hover { color: #f85149; }
  .assign-task-select {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 5px;
    padding: 4px 6px; font-size: 11px; width: 100%;
    font-family: 'Inter', sans-serif; cursor: pointer;
    transition: border-color .15s;
  }
  .assign-task-select:focus { outline: none; border-color: var(--accent); }

  .task-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    margin-top: 2px; width: fit-content;
  }

  .drop-hint {
    border: 1.5px dashed var(--border);
    border-radius: 7px; padding: 14px 8px;
    text-align: center; color: var(--muted);
    font-size: 10px; margin: 0;
    pointer-events: none;
  }
  .day-col.drag-over .drop-hint {
    border-color: var(--drag-border);
    color: var(--accent2);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">DW</div>
  <div>
    <h1>Inspector Scheduler</h1>
    <p>Dŵr Cymru Welsh Water — Distribution Operations</p>
  </div>
  <div class="header-right">
    <div class="week-nav">
      <button id="prevWeek" title="Previous week">‹</button>
      <div class="week-label" id="weekLabel"></div>
      <button id="nextWeek" title="Next week">›</button>
    </div>
    <button class="btn-clear" id="clearAll">Clear week</button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Task legend -->
    <div class="sidebar-section task-legend-wrap">
      <h3>Tasks</h3>
      <div class="task-legend" id="taskLegend"></div>
    </div>

    <!-- Availability pool -->
    <div class="sidebar-section avail-section">
      <h3>Available</h3>
      <div class="avail-day-tabs" id="dayTabs"></div>
      <div class="inspector-pool" id="inspectorPool"></div>
    </div>

  </aside>

  <!-- MAIN GRID -->
  <main class="main">
    <div class="grid-wrap" id="gridWrap"></div>
  </main>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const INSPECTORS = ['Vince','Ben','Jason','Geraint','Ryan','Fraser','Jordan','Anthony','Jack'];

const TASKS = [
  { id:'t1', name:'Swansea Checks',   color:'#1d4ed8', light:'#dbeafe' },
  { id:'t2', name:'Stradey Checks',   color:'#7c3aed', light:'#ede9fe' },
  { id:'t3', name:'Brackla Checks',   color:'#0891b2', light:'#cffafe' },
  { id:'t4', name:'Annuals',          color:'#15803d', light:'#dcfce7' },
  { id:'t5', name:'TMW',              color:'#b45309', light:'#fef3c7' },
  { id:'t6', name:'Site Maintenance', color:'#be185d', light:'#fce7f3' },
  { id:'t7', name:'DSF304',           color:'#dc2626', light:'#fee2e2' },
];

const AVATAR_COLORS = [
  '#1d4ed8','#7c3aed','#0891b2','#15803d',
  '#b45309','#be185d','#dc2626','#0d7377','#6b21a8'
];

const DAYS = ['Mon','Tue','Wed','Thu','Fri'];

// ── STATE ─────────────────────────────────────────────────────────────────────
// schedule[weekKey][dayIndex] = [{inspector, taskId, id}, ...]
let schedule = {};
let currentWeekStart = getMonday(new Date());
let selectedDay = 0; // sidebar pool tab

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function weekKey(d) {
  return d.toISOString().slice(0,10);
}
function formatDate(d, offset) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + offset);
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
}
function uid() { return Math.random().toString(36).slice(2,9); }

function getWeekSchedule() {
  const k = weekKey(currentWeekStart);
  if (!schedule[k]) schedule[k] = {0:[],1:[],2:[],3:[],4:[]};
  return schedule[k];
}

// Inspectors assigned on a given day for this week
function assignedOnDay(dayIdx) {
  const ws = getWeekSchedule();
  return (ws[dayIdx] || []).map(a => a.inspector);
}

// Available = not already on that day
function availableOnDay(dayIdx) {
  const taken = assignedOnDay(dayIdx);
  return INSPECTORS.filter(n => !taken.includes(n));
}

function avatarColor(name) {
  return AVATAR_COLORS[INSPECTORS.indexOf(name) % AVATAR_COLORS.length];
}
function initials(name) { return name.slice(0,2).toUpperCase(); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderWeekLabel();
  renderGrid();
  renderPool();
}

function renderWeekLabel() {
  const start = currentWeekStart;
  const end = new Date(start); end.setDate(end.getDate()+4);
  document.getElementById('weekLabel').textContent =
    start.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' – ' +
    end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function renderGrid() {
  const wrap = document.getElementById('gridWrap');
  wrap.innerHTML = '';
  const ws = getWeekSchedule();

  DAYS.forEach((day, di) => {
    const slots = ws[di] || [];
    const avail = availableOnDay(di);

    const col = document.createElement('div');
    col.className = 'day-col';
    col.dataset.day = di;

    col.innerHTML = `
      <div class="day-header">
        <div class="day-name">${day}${getDayToday(di)}</div>
        <div class="day-date">${formatDate(currentWeekStart, di)}</div>
        <div class="day-count"><span>${slots.length}</span> assigned · ${avail.length} available</div>
      </div>
      <div class="day-slots" id="slots-${di}">
        ${slots.length === 0 ? '<div class="drop-hint">Drop inspector here</div>' : ''}
        ${slots.map(a => renderCard(a)).join('')}
      </div>
    `;

    setupDropZone(col, di);
    wrap.appendChild(col);
  });

  // Attach card events
  DAYS.forEach((_, di) => {
    const ws2 = getWeekSchedule();
    (ws2[di]||[]).forEach(a => {
      const sel = document.querySelector(`[data-assign-id="${a.id}"]`);
      if (sel) {
        sel.querySelector('.assign-remove').addEventListener('click', () => removeAssign(di, a.id));
        sel.querySelector('.assign-task-select').addEventListener('change', (e) => updateTask(di, a.id, e.target.value));
      }
    });
  });
}

function getDayToday(di) {
  const today = new Date();
  const dt = new Date(currentWeekStart);
  dt.setDate(dt.getDate() + di);
  const same = today.toDateString() === dt.toDateString();
  return same ? ' <span style="font-size:9px;color:var(--water2);font-weight:400;margin-left:4px;">TODAY</span>' : '';
}

function renderCard(a) {
  const task = TASKS.find(t => t.id === a.taskId);
  const badgeHtml = task
    ? `<div class="task-badge" style="background:${task.color}22;color:${task.color};border:1px solid ${task.color}44">
        <span style="width:6px;height:6px;border-radius:50%;background:${task.color};display:inline-block"></span>
        ${task.name}
      </div>`
    : '';

  const taskOptions = TASKS.map(t =>
    `<option value="${t.id}" ${a.taskId===t.id?'selected':''}>${t.name}</option>`
  ).join('');

  return `
    <div class="assign-card" data-assign-id="${a.id}">
      <div class="assign-top">
        <div class="inspector-avatar" style="background:${avatarColor(a.inspector)}">${initials(a.inspector)}</div>
        <span class="assign-name">${a.inspector}</span>
        <button class="assign-remove" title="Remove">×</button>
      </div>
      <select class="assign-task-select">
        <option value="">— Assign task —</option>
        ${taskOptions}
      </select>
      ${badgeHtml}
    </div>
  `;
}

function renderPool() {
  renderDayTabs();
  renderInspectors();
}

function renderDayTabs() {
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === selectedDay ? ' active' : '');
    btn.textContent = d;
    btn.addEventListener('click', () => { selectedDay = i; renderPool(); });
    wrap.appendChild(btn);
  });
}

function renderInspectors() {
  const pool = document.getElementById('inspectorPool');
  pool.innerHTML = '';
  const avail = availableOnDay(selectedDay);

  if (avail.length === 0) {
    pool.innerHTML = '<div class="pool-empty">All assigned</div>';
    return;
  }

  avail.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'inspector-chip';
    chip.draggable = true;
    chip.dataset.inspector = name;
    chip.innerHTML = `
      <div class="inspector-avatar" style="background:${avatarColor(name)}">${initials(name)}</div>
      ${name}
    `;

    chip.addEventListener('dragstart', e => {
      e.dataTransfer.setData('inspector', name);
      e.dataTransfer.setData('source', 'pool');
      e.dataTransfer.effectAllowed = 'move';
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));

    pool.appendChild(chip);
  });
}

// ── TASK LEGEND ───────────────────────────────────────────────────────────────
function renderTaskLegend() {
  const wrap = document.getElementById('taskLegend');
  TASKS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'task-chip';
    chip.innerHTML = `<div class="task-dot" style="background:${t.color}"></div>${t.name}`;
    wrap.appendChild(chip);
  });
}

// ── DROP ZONES ────────────────────────────────────────────────────────────────
function setupDropZone(col, di) {
  col.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('drag-over');
  });
  col.addEventListener('dragleave', e => {
    if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });
  col.addEventListener('drop', e => {
    e.preventDefault();
    col.classList.remove('drag-over');
    const inspector = e.dataTransfer.getData('inspector');
    if (!inspector) return;
    addAssign(di, inspector);
  });
}

// ── MUTATIONS ─────────────────────────────────────────────────────────────────
function addAssign(dayIdx, inspector) {
  const ws = getWeekSchedule();
  if (!ws[dayIdx]) ws[dayIdx] = [];
  // prevent duplicates
  if (ws[dayIdx].find(a => a.inspector === inspector)) return;
  ws[dayIdx].push({ id: uid(), inspector, taskId: '' });
  render();
}

function removeAssign(dayIdx, assignId) {
  const ws = getWeekSchedule();
  ws[dayIdx] = (ws[dayIdx]||[]).filter(a => a.id !== assignId);
  render();
}

function updateTask(dayIdx, assignId, taskId) {
  const ws = getWeekSchedule();
  const a = (ws[dayIdx]||[]).find(a => a.id === assignId);
  if (a) { a.taskId = taskId; render(); }
}

// ── WEEK NAV ──────────────────────────────────────────────────────────────────
document.getElementById('prevWeek').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() - 7);
  render();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  currentWeekStart.setDate(currentWeekStart.getDate() + 7);
  render();
});
document.getElementById('clearAll').addEventListener('click', () => {
  if (confirm('Clear all assignments for this week?')) {
    const k = weekKey(currentWeekStart);
    schedule[k] = {0:[],1:[],2:[],3:[],4:[]};
    render();
  }
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTaskLegend();
render();
</script>
</body>
</html>
