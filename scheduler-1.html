<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCWW Inspector Scheduler</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #1c2330;
  --surface3: #21262d;
  --border:   #2a3441;
  --border2:  #374151;
  --text:     #e6edf3;
  --muted:    #7d8590;
  --accent:   #1f6feb;
  --accent2:  #388bfd;
  --water:    #0ea5e9;
  --water2:   #38bdf8;
  --warning:  #d29922;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 200;
  flex-shrink: 0;
}
.logo {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--water), var(--accent));
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600; color: #fff;
  flex-shrink: 0;
}
.header-titles h1 { font-size: 13px; font-weight: 600; }
.header-titles p  { font-size: 10px; color: var(--muted); margin-top: 1px; }
.header-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
}
.week-nav { display: flex; align-items: center; gap: 5px; }
.week-nav button {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); border-radius: 5px;
  width: 26px; height: 26px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all .15s;
}
.week-nav button:hover { border-color: var(--accent2); color: var(--accent2); }
.week-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted);
  min-width: 130px; text-align: center;
}
.btn-sm {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); border-radius: 5px;
  padding: 4px 10px; cursor: pointer; font-size: 10px;
  font-family: 'Inter', sans-serif; transition: all .15s;
}
.btn-sm:hover { border-color: var(--warning); color: var(--warning); }

/* ── BODY LAYOUT ── */
.body-wrap {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: 168px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 14px 10px;
  gap: 18px;
}
.sb-label {
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--muted); margin-bottom: 8px; padding: 0 2px;
}

/* Day tabs */
.day-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.day-tab {
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--muted); border-radius: 5px;
  padding: 3px 9px; font-size: 10px; font-weight: 500;
  cursor: pointer; transition: all .12s; font-family: 'Inter', sans-serif;
}
.day-tab:hover { border-color: var(--accent); color: var(--accent2); }
.day-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Inspector chips in pool */
.inspector-pool { display: flex; flex-direction: column; gap: 4px; min-height: 30px; }
.insp-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 8px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: grab; font-size: 11px; font-weight: 500;
  color: var(--text); transition: border-color .12s, background .12s;
  user-select: none;
}
.insp-chip:hover { border-color: var(--water); background: rgba(14,165,233,.07); }
.insp-chip:active { cursor: grabbing; }
.insp-chip.is-dragging { opacity: .25; }
.avatar {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.pool-empty {
  font-size: 10px; color: var(--muted);
  font-style: italic; padding: 6px 2px; text-align: center;
}

/* Task colour legend */
.task-legend { display: flex; flex-direction: column; gap: 5px; }
.legend-row {
  display: flex; align-items: center; gap: 7px;
  font-size: 10px; color: var(--muted); padding: 0 2px;
}
.legend-dot {
  width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0;
}

/* ── MAIN GRID ── */
.main {
  flex: 1;
  overflow: auto;
  padding: 12px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(180px, 1fr));
  gap: 8px;
  min-width: 900px;
  align-items: start;
}

/* Day column */
.day-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.day-head {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 9px 11px 8px;
}
.day-head-name {
  font-size: 12px; font-weight: 700; letter-spacing: .2px;
  display: flex; align-items: center; gap: 6px;
}
.today-badge {
  font-size: 8px; font-weight: 600;
  background: var(--water); color: #000;
  border-radius: 3px; padding: 1px 5px;
  letter-spacing: .5px;
}
.day-head-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--muted); margin-top: 3px;
}
.day-summary {
  font-size: 9px; color: var(--muted); margin-top: 4px;
}
.day-summary b { color: var(--water2); font-weight: 600; }

/* Task rows inside a day */
.task-rows { padding: 6px; display: flex; flex-direction: column; gap: 5px; }

.task-row {
  border-radius: 7px;
  border: 1px solid transparent;
  overflow: hidden;
  transition: border-color .12s;
}
.task-row.drag-active {
  border-color: var(--drag-col, #388bfd);
  box-shadow: 0 0 0 2px rgba(56,139,253,.15);
}

.task-row-head {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 8px;
  cursor: default;
  border-bottom: 1px solid transparent;
  border-radius: 7px 7px 0 0;
}
.task-row-head.has-people {
  border-bottom-color: rgba(255,255,255,.06);
  border-radius: 7px 7px 0 0;
}
.task-row-head.no-people { border-radius: 7px; }

.task-color-bar {
  width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0;
}
.task-row-name {
  font-size: 10px; font-weight: 600; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.task-drop-hint {
  font-size: 9px; color: var(--muted); opacity: .6;
  font-style: italic;
}
.task-row.drag-active .task-drop-hint { color: var(--accent2); opacity: 1; }

/* People inside a task row */
.task-people {
  padding: 4px 8px 6px;
  display: flex; flex-wrap: wrap; gap: 4px;
}
.person-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 6px 3px 4px;
  border-radius: 5px;
  font-size: 10px; font-weight: 500;
  color: #fff;
  animation: pop .15s ease-out;
  cursor: default;
}
@keyframes pop {
  from { transform: scale(.8); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
.person-tag .avatar { width: 16px; height: 16px; font-size: 7px; }
.person-tag-remove {
  background: none; border: none;
  color: rgba(255,255,255,.5);
  cursor: pointer; font-size: 12px; line-height: 1;
  padding: 0; margin-left: 1px;
  border-radius: 3px; transition: color .1s;
}
.person-tag-remove:hover { color: #fff; }

/* ── SAVE FLAG ── */
.save-flag {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; color: var(--muted);
  padding: 3px 8px 3px 6px;
  border: 1px solid var(--border); border-radius: 5px;
  white-space: nowrap;
}
.save-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #16a34a; flex-shrink: 0;
  transition: background .2s;
}
.save-flag.flash .save-dot { background: var(--water2); }
.save-flag.off { border-color: rgba(210,153,34,.35); color: var(--warning); }
.save-flag.off .save-dot { background: var(--warning); }

/* ── TASK EDITOR ── */
.sb-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; gap: 6px;
}
.sb-head .sb-label { margin-bottom: 0; }
.link-btn {
  background: none; border: none; color: var(--water2);
  font-size: 9px; cursor: pointer; font-family: 'Inter', sans-serif;
  padding: 2px 3px; border-radius: 4px; flex-shrink: 0;
}
.link-btn:hover { text-decoration: underline; }

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(1,4,9,.72);
  display: none; align-items: center; justify-content: center;
  z-index: 500; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  width: 100%; max-width: 440px; max-height: 86vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.modal-head h2 { font-size: 12px; font-weight: 700; }
.modal-head p { font-size: 9px; color: var(--muted); margin-top: 2px; }
.modal-body {
  padding: 10px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 6px;
}
.te-row {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px;
}
.te-color {
  width: 28px; height: 28px; padding: 2px; flex-shrink: 0;
  border: 1px solid var(--border2); border-radius: 6px;
  background: var(--surface3); cursor: pointer;
}
.te-name {
  flex: 1; min-width: 0;
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px;
  padding: 7px 8px; font-size: 11px; font-family: 'Inter', sans-serif;
}
.te-name:focus { outline: none; border-color: var(--accent2); }
.te-btn {
  background: var(--surface3); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  width: 28px; height: 28px; flex-shrink: 0; cursor: pointer;
  font-size: 12px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.te-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
.te-btn.danger:hover:not(:disabled) { border-color: #dc2626; color: #dc2626; }
.te-btn:disabled { opacity: .25; cursor: default; }
.modal-foot {
  padding: 10px; border-top: 1px solid var(--border);
  background: var(--surface2);
  display: flex; gap: 8px; align-items: center;
}
.modal-foot .spacer { flex: 1; }
.btn-primary {
  background: var(--accent); border: 1px solid var(--accent);
  color: #fff; border-radius: 6px; padding: 7px 14px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.btn-primary:hover { background: var(--accent2); }
.btn-ghost {
  background: transparent; border: 1px solid var(--border2);
  color: var(--muted); border-radius: 6px; padding: 7px 12px;
  font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif;
}
.btn-ghost:hover { color: var(--text); }

/* scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">DW</div>
  <div class="header-titles">
    <h1>Inspector Scheduler</h1>
    <p>Dŵr Cymru Welsh Water — Distribution Operations</p>
  </div>
  <div class="header-right">
    <div class="save-flag" id="saveFlag"><span class="save-dot"></span><span id="saveText">Saved</span></div>
    <div class="week-nav">
      <button id="btnPrev" title="Previous week">‹</button>
      <div class="week-label" id="weekLabel"></div>
      <button id="btnNext" title="Next week">›</button>
    </div>
    <button class="btn-sm" id="btnClear">Clear week</button>
  </div>
</header>

<!-- BODY -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div>
      <div class="sb-label">Available</div>
      <div class="day-tabs" id="dayTabs"></div>
      <div style="height:10px"></div>
      <div class="inspector-pool" id="pool"></div>
    </div>

    <div>
      <div class="sb-head">
        <div class="sb-label">Tasks</div>
        <button class="link-btn" id="btnEditTasks">Edit</button>
      </div>
      <div class="task-legend" id="legend"></div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="grid" id="grid"></div>
  </main>

</div>

<!-- TASK EDITOR -->
<div class="modal-backdrop" id="taskModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Edit tasks">
    <div class="modal-head">
      <h2>Edit tasks</h2>
      <p>Rename, recolour, reorder or remove. Changes apply to every week.</p>
    </div>
    <div class="modal-body" id="teBody"></div>
    <div class="modal-foot">
      <button class="btn-ghost" id="btnAddTask">+ Add task</button>
      <div class="spacer"></div>
      <button class="btn-ghost" id="btnCancelTasks">Cancel</button>
      <button class="btn-primary" id="btnSaveTasks">Save changes</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const INSPECTORS = ['Vince','Ben','Jason','Geraint','Ryan','Fraser','Jordan','Anthony','Jack'];

let TASKS = [
  { id:'t1',  name:'Swansea Checks',   color:'#2563eb' },
  { id:'t2',  name:'Stradey Checks',   color:'#7c3aed' },
  { id:'t3',  name:'Brackla Checks',   color:'#0891b2' },
  { id:'t4',  name:'Annuals',          color:'#16a34a' },
  { id:'t5',  name:'TMW',              color:'#d97706' },
  { id:'t6',  name:'Site Maintenance', color:'#db2777' },
  { id:'t7',  name:'DSF304',           color:'#dc2626' },
  { id:'t9',  name:'Valve Checks',     color:'#0d9488' },
  { id:'t10', name:'SRV Valving (Insp/Clean)', color:'#4f46e5' },
  { id:'t8',  name:'Annual Leave / Training / Sleeptime', color:'#4b5563' },
];

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const DAYS_SHORT = ['Mon','Tue','Wed','Thu','Fri'];

const AVATAR_COLORS = [
  '#2563eb','#7c3aed','#0891b2','#16a34a',
  '#d97706','#db2777','#dc2626','#0d7377','#6b21a8'
];

// ─── STATE ───────────────────────────────────────────────────────────────────

// schedule[weekKey][dayIdx][taskId] = [inspectorName, ...]
let schedule  = {};
let weekStart = getMonday(new Date());
let poolDay   = 0; // which day's pool is shown in sidebar

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function getMonday(d) {
  const dt = new Date(d);
  const diff = dt.getDay() === 0 ? -6 : 1 - dt.getDay();
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function wk(d) { return d.toISOString().slice(0,10); }
function fmtDate(offset) {
  const dt = new Date(weekStart);
  dt.setDate(dt.getDate() + offset);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function isToday(offset) {
  const dt = new Date(weekStart);
  dt.setDate(dt.getDate() + offset);
  return dt.toDateString() === new Date().toDateString();
}

function getWS() {
  const k = wk(weekStart);
  if (!schedule[k]) {
    schedule[k] = {};
    for (let d=0;d<5;d++) { schedule[k][d] = {}; TASKS.forEach(t => { schedule[k][d][t.id] = []; }); }
  }
  return schedule[k];
}

function assignedOnDay(di) {
  const ws = getWS();
  return TASKS.flatMap(t => (ws[di][t.id] || []).map(e => typeof e==='string'?e:e.name));
}

function availableOnDay(di) {
  const taken = new Set(assignedOnDay(di));
  return INSPECTORS.filter(n => !taken.has(n));
}

function avatarBg(name) { return AVATAR_COLORS[INSPECTORS.indexOf(name) % AVATAR_COLORS.length]; }
function initials(n)    { return n.slice(0,2).toUpperCase(); }

function taskById(id)   { return TASKS.find(t => t.id === id); }

function darken(hex, amount=40) {
  // simple luminance reduction for tag backgrounds
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0,r-amount); g = Math.max(0,g-amount); b = Math.max(0,b-amount);
  return `rgba(${r},${g},${b},0.55)`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  renderWeekLabel();
  renderGrid();
  renderSidebar();
}

function renderWeekLabel() {
  const end = new Date(weekStart); end.setDate(end.getDate()+4);
  document.getElementById('weekLabel').textContent =
    weekStart.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' – ' +
    end.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

// ── GRID ──────────────────────────────────────────────────────────────────────

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const ws = getWS();

  for (let di=0; di<5; di++) {
    const totalAssigned = assignedOnDay(di).length;
    const avail = availableOnDay(di).length;

    const col = document.createElement('div');
    col.className = 'day-col';

    // Header
    const todayBadge = isToday(di) ? `<span class="today-badge">TODAY</span>` : '';
    col.innerHTML = `
      <div class="day-head">
        <div class="day-head-name">${DAYS[di]}${todayBadge}</div>
        <div class="day-head-date">${fmtDate(di)}</div>
        <div class="day-summary"><b>${totalAssigned}</b> assigned · ${avail} available</div>
      </div>
      <div class="task-rows" id="taskrows-${di}"></div>
    `;

    grid.appendChild(col);

    // Task rows
    const rowsWrap = col.querySelector(`#taskrows-${di}`);
    TASKS.forEach(task => {
      const people = ws[di][task.id] || [];
      rowsWrap.appendChild(buildTaskRow(di, task, people));
    });
  }
}

function buildTaskRow(di, task, people) {
  const row = document.createElement('div');
  row.className = 'task-row';
  row.style.setProperty('--drag-col', task.color);
  row.style.background = darken(task.color, 60) ;

  const hasPeople = people.length > 0;
  const head = document.createElement('div');
  head.className = 'task-row-head' + (hasPeople ? ' has-people' : ' no-people');
  head.style.background = task.color + '22';
  head.innerHTML = `
    <div class="task-color-bar" style="background:${task.color}"></div>
    <span class="task-row-name" style="color:${task.color}">${task.name}</span>
    <span class="task-drop-hint">drop here</span>
  `;
  row.appendChild(head);

  // People
  if (hasPeople) {
    const peopleWrap = document.createElement('div');
    peopleWrap.className = 'task-people';
    people.forEach(entry => {
      const name = typeof entry === 'string' ? entry : entry.name;

      const tag = document.createElement('div');
      tag.className = 'person-tag';
      tag.style.background = avatarBg(name) + 'cc';
      tag.innerHTML = `
        <div class="avatar" style="background:${avatarBg(name)}">${initials(name)}</div>
        ${name}
        <button class="person-tag-remove" title="Remove ${name}">×</button>
      `;
      tag.querySelector('.person-tag-remove').addEventListener('click', () => removeAssign(di, task.id, name));
      peopleWrap.appendChild(tag);
    });
    row.appendChild(peopleWrap);
  }

  // Drop zone events
  row.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    row.classList.add('drag-active');
  });
  row.addEventListener('dragleave', e => {
    if (!row.contains(e.relatedTarget)) row.classList.remove('drag-active');
  });
  row.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    row.classList.remove('drag-active');
    const name = e.dataTransfer.getData('inspector');
    if (name) addAssign(di, task.id, name);
  });

  return row;
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────

function renderSidebar() {
  renderDayTabs();
  renderPool();
  renderLegend();
}

function renderDayTabs() {
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  DAYS_SHORT.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === poolDay ? ' active' : '');
    btn.textContent = d;
    btn.addEventListener('click', () => { poolDay = i; renderSidebar(); });
    wrap.appendChild(btn);
  });
}

function renderPool() {
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  const avail = availableOnDay(poolDay);

  if (!avail.length) {
    pool.innerHTML = '<div class="pool-empty">All assigned for ' + DAYS_SHORT[poolDay] + '</div>';
    return;
  }

  avail.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'insp-chip';
    chip.draggable = true;
    chip.innerHTML = `<div class="avatar" style="background:${avatarBg(name)}">${initials(name)}</div>${name}`;

    chip.addEventListener('dragstart', e => {
      e.dataTransfer.setData('inspector', name);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => chip.classList.add('is-dragging'), 0);
    });
    chip.addEventListener('dragend', () => chip.classList.remove('is-dragging'));

    pool.appendChild(chip);
  });
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  TASKS.forEach(t => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<div class="legend-dot" style="background:${t.color}"></div>${t.name}`;
    legend.appendChild(row);
  });
}

// ─── MUTATIONS ───────────────────────────────────────────────────────────────

function addAssign(di, taskId, name) {
  const ws = getWS();
  if (!ws[di][taskId]) ws[di][taskId] = [];
  const alreadyHere = ws[di][taskId].some(e => (typeof e==='string'?e:e.name) === name);
  if (alreadyHere) return;
  // Move from any other task this day
  TASKS.forEach(t => {
    ws[di][t.id] = (ws[di][t.id]||[]).filter(e => (typeof e==='string'?e:e.name) !== name);
  });
  ws[di][taskId].push(name);
  render();
  saveState();
}

function removeAssign(di, taskId, name) {
  const ws = getWS();
  ws[di][taskId] = (ws[di][taskId]||[]).filter(e => (typeof e==='string'?e:e.name) !== name);
  render();
  saveState();
}

// ─── TASK EDITOR ──────────────────────────────────────────────────────────────

let editDraft = null;
let taskSeq   = 100;

const NEW_TASK_COLORS = ['#0891b2','#7c3aed','#16a34a','#d97706','#db2777','#0d9488','#4f46e5','#dc2626'];

function newTaskId() { return 'tx' + (++taskSeq); }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// how many assignments exist for a task across every week
function countAssigned(taskId) {
  let n = 0;
  Object.values(schedule).forEach(week =>
    Object.values(week).forEach(day => { n += (day[taskId] || []).length; })
  );
  return n;
}

function openTaskEditor() {
  editDraft = TASKS.map(t => ({ ...t }));
  renderTaskEditor();
  document.getElementById('taskModal').classList.add('open');
}

function closeTaskEditor() {
  document.getElementById('taskModal').classList.remove('open');
  editDraft = null;
}

function renderTaskEditor() {
  const body = document.getElementById('teBody');
  body.innerHTML = '';

  editDraft.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'te-row';
    row.innerHTML = `
      <input type="color" class="te-color" value="${t.color}" title="Task colour">
      <input type="text" class="te-name" value="${esc(t.name)}" placeholder="Task name">
      <button class="te-btn" title="Move up"   ${i === 0 ? 'disabled' : ''}>&#8593;</button>
      <button class="te-btn" title="Move down" ${i === editDraft.length - 1 ? 'disabled' : ''}>&#8595;</button>
      <button class="te-btn danger" title="Remove task">&times;</button>
    `;

    const [colorEl, nameEl] = [row.querySelector('.te-color'), row.querySelector('.te-name')];
    const [upBtn, downBtn, delBtn] = row.querySelectorAll('.te-btn');

    colorEl.addEventListener('input', e => { t.color = e.target.value; });
    nameEl.addEventListener('input',  e => { t.name  = e.target.value; });

    upBtn.addEventListener('click', () => {
      [editDraft[i-1], editDraft[i]] = [editDraft[i], editDraft[i-1]];
      renderTaskEditor();
    });
    downBtn.addEventListener('click', () => {
      [editDraft[i+1], editDraft[i]] = [editDraft[i], editDraft[i+1]];
      renderTaskEditor();
    });
    delBtn.addEventListener('click', () => {
      const n = countAssigned(t.id);
      const msg = n
        ? `Remove "${t.name}"? ${n} assignment${n === 1 ? '' : 's'} will be cleared and those inspectors go back to the pool.`
        : `Remove "${t.name}"?`;
      if (confirm(msg)) { editDraft.splice(i, 1); renderTaskEditor(); }
    });

    body.appendChild(row);
  });
}

function addDraftTask() {
  const color = NEW_TASK_COLORS[editDraft.length % NEW_TASK_COLORS.length];
  editDraft.push({ id: newTaskId(), name: '', color });
  renderTaskEditor();
  const body = document.getElementById('teBody');
  body.scrollTop = body.scrollHeight;
  const inputs = body.querySelectorAll('.te-name');
  inputs[inputs.length - 1].focus();
}

function saveTaskEditor() {
  const cleaned = editDraft
    .map(t => ({ ...t, name: t.name.trim() }))
    .filter(t => t.name.length);

  if (!cleaned.length) { alert('Add at least one task before saving.'); return; }

  // clear assignments belonging to removed tasks
  const keep = new Set(cleaned.map(t => t.id));
  Object.values(schedule).forEach(week =>
    Object.values(week).forEach(day =>
      Object.keys(day).forEach(id => { if (!keep.has(id)) delete day[id]; })
    )
  );

  TASKS = cleaned;
  closeTaskEditor();
  render();
  saveState();
}

document.getElementById('btnEditTasks').addEventListener('click', openTaskEditor);
document.getElementById('btnAddTask').addEventListener('click', addDraftTask);
document.getElementById('btnCancelTasks').addEventListener('click', closeTaskEditor);
document.getElementById('btnSaveTasks').addEventListener('click', saveTaskEditor);
document.getElementById('taskModal').addEventListener('click', e => {
  if (e.target.id === 'taskModal') closeTaskEditor();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editDraft) closeTaskEditor();
});

// ─── SAVING ──────────────────────────────────────────────────────────────────

const STORE_KEY = 'dcww-inspector-scheduler-v1';
let storageOK = true;
let flashTimer = null;

function setSaveFlag(text, off) {
  const flag = document.getElementById('saveFlag');
  document.getElementById('saveText').textContent = text;
  flag.classList.toggle('off', !!off);
}

function saveState() {
  if (!storageOK) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, tasks: TASKS, schedule }));
    const flag = document.getElementById('saveFlag');
    setSaveFlag('Saved', false);
    flag.classList.add('flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => flag.classList.remove('flash'), 600);
  } catch (err) {
    storageOK = false;
    setSaveFlag('Not saving here', true);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.tasks) && data.tasks.length) TASKS = data.tasks;
      if (data.schedule && typeof data.schedule === 'object') schedule = data.schedule;
    }
    setSaveFlag('Saved', false);
  } catch (err) {
    storageOK = false;
    setSaveFlag('Not saving here', true);
  }
}

// ─── CONTROLS ────────────────────────────────────────────────────────────────

document.getElementById('btnPrev').addEventListener('click', () => {
  weekStart.setDate(weekStart.getDate()-7); render();
});
document.getElementById('btnNext').addEventListener('click', () => {
  weekStart.setDate(weekStart.getDate()+7); render();
});
document.getElementById('btnClear').addEventListener('click', () => {
  if (confirm('Clear all assignments for this week?')) {
    delete schedule[wk(weekStart)]; render(); saveState();
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
loadState();
render();
</script>
